name: Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday

jobs:
  # Dependency vulnerability scanning
  dependency-scan:
    name: Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
      
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
  
  # CodeQL analysis
  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript, typescript, dart]
    steps:
      - uses: actions/checkout@v7
      
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: +security-and-quality
      
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
  
  # Secret scanning
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      
      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD
          extra_args: --fail --json
  
  # Container scanning
  container-scan:
    name: Container Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Build Docker images
        run: |
          docker-compose build
      
      - name: Scan API image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'pesaloan-api:latest'
          format: 'sarif'
          output: 'trivy-api.sarif'
          severity: 'CRITICAL,HIGH'
      
      - name: Scan Admin image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'pesaloan-admin:latest'
          format: 'sarif'
          output: 'trivy-admin.sarif'
          severity: 'CRITICAL,HIGH'
      
      - name: Upload API scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-api.sarif'
      
      - name: Upload Admin scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-admin.sarif'
  
  # SAST for mobile
  mobile-sast:
    name: Mobile SAST
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: 'stable'
      
      - name: Get dependencies
        run: cd apps/mobile && flutter pub get
      
      - name: Run Flutter analyze
        run: cd apps/mobile && flutter analyze
      
      - name: Run Dart CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: dart
      
      - name: Perform Dart CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:dart"