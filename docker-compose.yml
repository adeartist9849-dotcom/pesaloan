version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pesaloan-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pesaloan
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/api/prisma/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pesaloan-network

  redis:
    image: redis:7-alpine
    container_name: pesaloan-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - pesaloan-network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: pesaloan-api
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/pesaloan?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-jwt-secret-change-in-production-min-32-chars
      JWT_EXPIRY: 15m
      REFRESH_TOKEN_EXPIRY: 90d
      ENCRYPTION_KEY: dev-encryption-key-32-chars-long!!
      MPESA_CONSUMER_KEY: ${MPESA_CONSUMER_KEY}
      MPESA_CONSUMER_SECRET: ${MPESA_CONSUMER_SECRET}
      MPESA_PASSKEY: ${MPESA_PASSKEY}
      MPESA_SHORTCODE: ${MPESA_SHORTCODE}
      MPESA_BASE_URL: https://sandbox.safaricom.co.ke
      MPESA_CALLBACK_URL: http://localhost:3000/api/v1/mobile-money/mpesa/callback
      KYC_PROVIDER: mock
      SMS_PROVIDER: mock
      PUSH_PROVIDER: mock
      LOG_LEVEL: debug
    ports:
      - "3000:3000"
    volumes:
      - ./apps/api:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pesaloan-network
    command: sh -c "npx prisma generate && npx prisma db push && npm run dev"

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    container_name: pesaloan-admin
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:3000
    ports:
      - "3001:3001"
    volumes:
      - ./apps/admin:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api
    networks:
      - pesaloan-network
    command: npm run dev

  mailhog:
    image: mailhog/mailhog:latest
    container_name: pesaloan-mailhog
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    networks:
      - pesaloan-network

volumes:
  postgres_data:
  redis_data:

networks:
  pesaloan-network:
    driver: bridge
